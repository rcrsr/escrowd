# The uv workspace (APP-WS-3) and the only ruff, ty and pytest config (APP-SQ-5).
# requires-python and the ruff/ty targets stay at 3.11, not the standard's 3.14:
# the Python SDK supports 3.11 and the conformance matrix runs it (CLAUDE.md).
[project]
name = "escrowd-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false
python-preference = "only-managed"
exclude-newer = "7 days" # APP-SUP-1: Python twin of pnpm minimumReleaseAge
# APP-SUP-2: per-package cutoffs for releases the 2026-11-23 sweep took inside the 7-day
# window. Each entry admits one release; delete it on the date shown.
exclude-newer-package = { grpcio = "2026-11-19T00:00:00Z", grpcio-tools = "2026-11-19T00:00:00Z", ruff = "2026-11-20T00:00:00Z", ty = "2026-11-23T00:00:00Z" } # delete grpcio*, ruff 2026-11-27; ty 2026-11-30

[tool.uv.workspace]
members = ["libs/python-sdk", "libs/testkit"] # libs/escrowd is Rust

[tool.uv.sources]
escrowd = { workspace = true }
escrow-testkit = { workspace = true }

[dependency-groups]
dev = [
  "escrowd",
  "escrow-testkit",
  "grpcio-tools>=1.85.3",
  "ruff>=0.17",
  "ty>=0.0.107",
  "tach>=0.35",
  "deptry>=0.25",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "pytest-xdist>=3.8",
  "pytest-randomly>=5.0",
  "pytest-timeout>=2.4",
  "hypothesis>=6.170",
  "diff-cover>=11.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["libs/python-sdk/src/escrow/v1", "spikes"] # generated by gen.sh; frozen spikes

[tool.ruff.lint]
select = [
  "E", "F", "UP", "B", "BLE", "SIM", "I", "LOG", "PGH", "PTH", "PIE", "FURB",
  "C4", "G", "DTZ", "T20", "RUF", "ASYNC", "PLE", "TID251", "S608",
  "C901", "PLR0912", "PLR0915",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["escrow", "escrow_testkit"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = ["libs/python-sdk/src/escrow/v1", "spikes"]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
blanket-ignore-comment = "error"
possibly-unresolved-reference = "error"

[[tool.ty.overrides]]
include = ["**/tests/**"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-explicit-return = "ignore"

[tool.pytest.ini_options]
addopts = "-q --strict-markers -n auto" # pytest-randomly shuffles order by default
timeout = 60
markers = ["slow: deselect with -m 'not slow'", "integration: needs local services"]

[tool.coverage.run]
branch = true
source = ["libs/python-sdk/src", "libs/testkit"]

[tool.coverage.report]
fail_under = 80
skip_covered = true
