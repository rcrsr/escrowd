[workspace]
resolver = "3"
members = ["crates/escrowd", "crates/escrow-cli"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
escrowd = { path = "crates/escrowd" }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
prost = "0.14"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "process"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "router", "server", "channel"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.2"
fuser = "0.18"
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5.3", features = ["util"] }
globset = "0.4.20"
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs", "net", "process", "rand"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"

# A panic aborts: the next start recovers from the journal, where an unwinding
# FUSE or RPC thread would leave requests unanswered on a live mount.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
