[workspace]
resolver = "3"
members = ["libs/escrowd", "libs/proto", "apps/cli"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

# APP-SQ-9. Crates opt in with [lints] workspace = true; no crate-level #![deny].
[workspace.lints.rust]
unsafe_code = "deny" # FFI crates opt out with #![allow(unsafe_code)] plus a reason

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[workspace.dependencies]
parking_lot = "0.13.0"
escrowd = { path = "libs/escrowd" }
escrowd-proto = { path = "libs/proto" }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
prost = "0.14"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "sync"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.9", default-features = false, features = ["codegen", "router", "server", "channel"] }
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
protoc-bin-vendored = "3.3"
fuser = "0.19"
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5.3", features = ["util"] }
globset = "0.4.22"
libc = "0.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["fs", "net", "process", "rand"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
serde_json = "1.0.154"
pbjson = "0.9.0"
pbjson-build = "0.9.0"

# A panic aborts: the next start recovers from the journal, where an unwinding
# FUSE or RPC thread would leave requests unanswered on a live mount.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
