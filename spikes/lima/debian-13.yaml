# Phase 0 host matrix VM. Start: limactl start --name=escrow-debian-13 spikes/lima/debian-13.yaml
minimumLimaVersion: 2.0.0
base:
- template:debian-13
cpus: 2
memory: 2GiB
disk: 20GiB
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    command -v bwrap >/dev/null && command -v fusermount3 >/dev/null && command -v git >/dev/null && command -v python3 >/dev/null && exit 0
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends bubblewrap fuse3 git python3
