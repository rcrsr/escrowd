# Phase 0.6 benchmark VM: larger so pnpm install and the express tests run without memory pressure.
# Start: limactl start --name=escrow-bench spikes/lima/bench-ubuntu-24.04.yaml
minimumLimaVersion: 2.0.0
base:
- template:ubuntu-24.04
cpus: 4
memory: 4GiB
disk: 20GiB
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    command -v bwrap >/dev/null && command -v fusermount3 >/dev/null && exit 0
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends bubblewrap fuse3
