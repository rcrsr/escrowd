# Phase 0 host matrix VM. Start: limactl start --name=escrow-fedora-44 spikes/lima/fedora-44.yaml
minimumLimaVersion: 2.0.0
base:
- template:fedora-44
cpus: 2
memory: 2GiB
disk: 20GiB
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    command -v bwrap >/dev/null && command -v fusermount3 >/dev/null && command -v git >/dev/null && command -v python3 >/dev/null && exit 0
    dnf install -y bubblewrap fuse3 git python3
