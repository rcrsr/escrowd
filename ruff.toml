line-length = 100
target-version = "py314"
extend-exclude = ["sdk/python/src/escrow/v1", "spikes"]  # generated by gen.sh; frozen spikes
include = ["sdk/**/*.py", "tests/**/*.py", "examples/**/*.py"]  # Python only; ruff also formats code blocks in *.md

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[lint.isort]
known-first-party = ["escrow"]

[format]
quote-style = "double"
indent-style = "space"
