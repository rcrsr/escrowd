# cargo-deny (APP-SUP-6): advisories, licenses, bans, sources. Runs in each Rust project's `deps` target.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path deps (all publish = false)

[sources]
unknown-registry = "deny"
unknown-git = "deny"
