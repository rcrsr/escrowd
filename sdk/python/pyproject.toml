[project]
name = "escrow"
version = "0.1.0"
description = "Python SDK for escrowd: scopes over escrowed filesystem IO"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "grpcio==1.84.0",
    "protobuf==7.36.2",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.84.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "ty==0.0.84",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.pytest]
testpaths = ["../../tests/conformance"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]
exclude = ["src/escrow/v1"]
