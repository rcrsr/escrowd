[project]
name = "escrowd"
version = "0.1.0"
description = "Python SDK for escrowd: scopes over escrowed filesystem IO"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.85.3,<2",
    "protobuf>=7.36.2,<8",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/rcrsr/escrowd"
Repository = "https://github.com/rcrsr/escrowd"
Issues = "https://github.com/rcrsr/escrowd/issues"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

# The distribution is `escrowd` (the name `escrow` is taken on PyPI); the package stays `escrow`.
[tool.uv.build-backend]
module-name = "escrow"

