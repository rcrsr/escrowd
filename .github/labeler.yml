# escrowd area taxonomy: `area:*` labels applied by .github/workflows/pr-labels.yml.
# Every label whose glob matches a changed path is applied; a PR spanning areas
# carries several. PR titles keep conventional-commit format (`feat(daemon): …`).
#
#   area:daemon   libs/escrowd, libs/proto and proto/: capture, scopes, journal, gate, ledger, protocol
#   area:cli      apps/cli: the `escrow` command
#   area:sdk      libs/*-sdk: language SDKs
#   area:sandbox  packaging/: escrowd's bwrap and AppArmor profile
#   area:tests    tests/, libs/testkit and examples/: the conformance suite, its harness and test app
#   area:docs     docs/: design and phase plans
#   area:spikes   spikes/: phase 0 throwaway spikes and results
#   area:dx       CI, toolchain, root config and the .claude workspace

area:daemon:
  - changed-files:
      - any-glob-to-any-file: ["libs/escrowd/**", "libs/proto/**", "proto/**"]

area:cli:
  - changed-files:
      - any-glob-to-any-file: ["apps/cli/**"]

area:sdk:
  - changed-files:
      - any-glob-to-any-file: ["libs/*-sdk/**"]

area:sandbox:
  - changed-files:
      - any-glob-to-any-file: ["packaging/**"]

area:tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**", "libs/testkit/**", "examples/**"]

area:docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**"]

area:spikes:
  - changed-files:
      - any-glob-to-any-file: ["spikes/**"]

area:dx:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".claude/**"
          - "mise.toml"
          - "rust-toolchain.toml"
          - "rustfmt.toml"
          - "mise.lock"
          - "pyproject.toml"
          - "uv.lock"
          - "clippy.toml"
          - "deny.toml"
          - "tach.toml"
          - "_typos.toml"
          - ".editorconfig"
          - ".config/**"
          - "Makefile"
          - "VERSION"
          - "lefthook.yml"
          - "scripts/**"
          - "Cargo.toml"
          - "CLAUDE.md"
          - ".gitignore"
          - "package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
          - "nx.json"
          - "**/project.json"
