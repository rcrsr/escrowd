name: CI

# Pull requests only. `changes` gates each job on the paths it covers (every
# job runs when this file changes); `CI Gate` is the one check to require.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'proto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.github/workflows/ci.yml'
            python:
              - 'sdk/python/**'
              - 'tests/**'
              - 'examples/**'
              - 'proto/**'
              - '.python-version'
              - '.github/workflows/ci.yml'
            conformance:
              - 'crates/**'
              - 'proto/**'
              - 'sdk/python/**'
              - 'tests/**'
              - 'examples/**'
              - 'packaging/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.python-version'
              - '.github/workflows/ci.yml'

  check-rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check Rust crates
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  check-python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache .venv
        uses: actions/cache@v6
        with:
          path: |
            sdk/python/.venv
            ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: venv-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('sdk/python/uv.lock') }}

      - name: Install dependencies
        run: uv sync --project sdk/python --frozen

      - name: Check Python
        run: |
          uv run --project sdk/python --frozen ruff check
          uv run --project sdk/python --frozen ruff format --check
          uv run --project sdk/python --frozen ty check --project sdk/python

      - name: Python stubs match proto/
        run: sdk/python/gen.sh && git diff --exit-code sdk/python/src

  # The suite needs the daemon binary, the Python SDK and the AppArmor profile, on every
  # Ubuntu LTS runner (24.04: restriction without a bwrap profile; 26.04: also confines fusermount3).
  conformance:
    name: Conformance (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y bubblewrap fuse3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache .venv
        uses: actions/cache@v6
        with:
          path: |
            sdk/python/.venv
            ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: venv-${{ matrix.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('sdk/python/uv.lock') }}

      - name: escrowd bwrap and AppArmor profile
        run: packaging/ubuntu/install.sh

      - name: Build
        run: cargo build --locked

      # Exit criterion: 10 consecutive passing runs; the job fails on the first failed run.
      - name: Conformance suite, 10 consecutive runs
        run: |
          for i in $(seq 1 10); do
            echo "::group::run $i of 10"
            uv run --project sdk/python --frozen pytest -v tests/conformance
            echo "::endgroup::"
          done

  lockfiles:
    name: Lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            crates
            sdk
            .github
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml
            .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: uv.lock in sync with pyproject.toml
        run: uv lock --check --project sdk/python

      - name: Cargo.lock in sync with manifests
        run: cargo metadata --locked --format-version=1 > /dev/null

  ci-gate:
    name: CI Gate
    if: always()
    needs: [check-rust, check-python, conformance, lockfiles]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "Job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
