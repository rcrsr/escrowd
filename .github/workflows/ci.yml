name: CI

# Pull requests only; no path filters (APP-CI-5): Nx's affected graph decides what runs.
# `CI Gate` is the one required check. The suite runs once here (conformance.yml);
# `ci-repeat.yml` repeats it 10 times on demand (`ci:repeat`). Commands live in the
# package.json scripts and Nx targets; NX_BASE selects the affected base (D8).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_BASE: origin/main

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    outputs:
      soak: ${{ steps.soak.outputs.soak }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true # protocol:test runs buf breaking against the protocol-v1 tag
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Static checks (affected)
        run: pnpm run check:affected

      - name: Unit tests (affected)
        run: pnpm run test:affected

      - name: Build (affected)
        run: pnpm run build:affected

      - name: Secrets and known vulnerabilities
        run: pnpm run check:security

      - name: Spelling
        run: pnpm run check:spelling

      - name: Repo standards
        run: pnpm run check:standards

      - name: Versions
        run: pnpm run check:versions

      - name: Workflow security
        run: zizmor --min-severity high .github/

      # The commit path and held decisions: the crash and held soaks follow the suite.
      - name: Soak needed
        id: soak
        run: |
          if git diff --name-only "$NX_BASE"...HEAD \
            | grep -qE '^(libs/escrowd/src/(commit/|history\.rs|journal\.rs|snapshot\.rs|fault\.rs)|tests/soak/|libs/testkit/|tests/fixtures/)'; then
            echo "soak=true" >> "$GITHUB_OUTPUT"
          else
            echo "soak=false" >> "$GITHUB_OUTPUT"
          fi

  # Early warning, not required by the CI Gate: the affected Rust projects on current stable
  # instead of the rust-toolchain.toml pin.
  check-rust-stable:
    name: Rust (stable, advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          rust-cache-key: stable

      - name: Check Rust crates on stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          export RUSTUP_TOOLCHAIN=stable
          rustc --version
          pnpm exec nx run-many -t lint test -p 'tag:lang:rust'

  # Changed-line coverage at 80% (APP-TS-5): the suite against an instrumented daemon.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y bubblewrap fuse3

      - uses: ./.github/actions/setup-toolchain
        with:
          rust-cache-key: coverage

      - name: escrowd bwrap and AppArmor profile
        run: packaging/ubuntu/install.sh

      - name: Changed-line coverage
        run: pnpm run test:coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: ignore
          retention-days: 7

  conformance:
    name: Conformance
    needs: check
    uses: ./.github/workflows/conformance.yml
    with:
      soak: ${{ needs.check.outputs.soak == 'true' }}

  ci-gate:
    name: CI Gate
    if: always()
    needs: [check, coverage, conformance]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [[ "$r" != "success" ]]; then
              echo "A required job ended with: $r"
              exit 1
            fi
          done
          echo "All required jobs passed"
