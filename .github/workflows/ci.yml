name: CI

# Pull requests only. `changes` gates each job on the paths it covers (every
# job runs when this file changes); `CI Gate` is the one check to require. The
# suite runs once here; `ci-repeat.yml` repeats it 10 times on demand (`ci:repeat`).
# Tool commands live in the nx targets (project.json files); jobs call `nx run-many`.
# Toolchain and workspace files (package.json, lockfile, nx.json, mise.toml, the
# setup-nx action) are in the filter of each job that reads them.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      conformance: ${{ steps.filter.outputs.conformance }}
      soak: ${{ steps.filter.outputs.soak }}
      protocol: ${{ steps.filter.outputs.protocol }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'proto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'nx.json'
              - 'mise.toml'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            python:
              - 'sdk/python/**'
              - 'tests/**'
              - 'examples/**'
              - 'bench/**'
              - 'proto/**'
              - '.python-version'
              - 'ruff.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'nx.json'
              - 'mise.toml'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            protocol:
              - 'proto/**'
              - 'buf.yaml'
              - 'project.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'nx.json'
              - 'mise.toml'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            # The commit path and held decisions: run the crash and held soaks (50 random
            # kills each) after the suite.
            soak:
              - 'crates/escrowd/src/commit/**'
              - 'crates/escrowd/src/history.rs'
              - 'crates/escrowd/src/journal.rs'
              - 'crates/escrowd/src/snapshot.rs'
              - 'crates/escrowd/src/fault.rs'
              - 'tests/soak/**'
              - 'tests/support/**'
              - 'tests/fixtures/**'
            conformance:
              - 'crates/**'
              - 'proto/**'
              - 'sdk/python/**'
              - 'tests/**'
              - 'examples/**'
              - 'packaging/**'
              - 'docs/protocol.md'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.python-version'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'nx.json'
              - 'mise.toml'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/conformance.yml'

  check-rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-nx

      - name: Check Rust crates
        run: pnpm exec nx run-many -t lint test -p rust

  # The frozen protocol (docs/protocol.md): linted, formatted, and no breaking change
  # against the protocol-v1 tag (buf's FILE rules: generated code keeps compiling).
  check-protocol:
    name: Protocol
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read the buf pin
        id: pin
        run: echo "buf=$(sed -n 's/^buf = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ steps.pin.outputs.buf }}
          setup_only: true

      - uses: ./.github/actions/setup-nx

      - name: Lint, format and breaking-change check
        run: pnpm exec nx run-many -t lint test -p protocol

  # Early warning, not required by the CI Gate: the workspace on current stable Rust
  # instead of the rust-toolchain.toml pin (RUSTUP_TOOLCHAIN overrides the file).
  check-rust-stable:
    name: Rust (stable, advisory)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: stable

      - uses: ./.github/actions/setup-nx

      - name: Check Rust crates on stable
        run: |
          rustc --version
          pnpm exec nx run-many -t lint test -p rust

  check-python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache .venv
        uses: actions/cache@v6
        with:
          path: |
            sdk/python/.venv
            ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: venv-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('sdk/python/uv.lock') }}

      - name: Install dependencies
        run: uv sync --project sdk/python --frozen

      - uses: ./.github/actions/setup-nx

      - name: Check Python
        run: pnpm exec nx run-many -t lint test build -p python-sdk

  # One suite run on each Ubuntu LTS runner (see conformance.yml), then the crash
  # soak when the commit path changed.
  conformance:
    name: Conformance
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    uses: ./.github/workflows/conformance.yml
    with:
      soak: ${{ needs.changes.outputs.soak == 'true' }}

  lockfiles:
    name: Lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            crates
            sdk
            tests/support
            .github
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            mise.toml
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml
            .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Frozen pnpm install matches pnpm-lock.yaml
        uses: ./.github/actions/setup-nx

      - name: uv.lock in sync with pyproject.toml
        run: uv lock --check --project sdk/python

      - name: Cargo.lock in sync with manifests
        run: cargo metadata --locked --format-version=1 > /dev/null

  ci-gate:
    name: CI Gate
    if: always()
    needs: [check-rust, check-protocol, check-python, conformance, lockfiles]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "Job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
