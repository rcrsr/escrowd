name: Conformance

# Reusable: the conformance suite on every Ubuntu LTS runner (24.04: restriction without
# a bwrap profile; 26.04: also confines fusermount3). It needs the daemon binary, the
# Python SDK and the AppArmor profile; the SDK's oldest Python (3.11) runs on 24.04 beside
# the pinned one (.python-version). `ci.yml` runs the suite once per pull request;
# `ci-repeat.yml` runs it `runs` times in a row (check 8: 10 consecutive passes).

on:
  workflow_call:
    inputs:
      runs:
        description: Consecutive suite runs per runner; the job fails on the first failed run.
        type: number
        default: 1
      soak:
        description: Run the crash soak (50 random kills mid-commit) and the held soak (50 kills mid-review) after the suite, then the suite and both soaks (20 kills each) on a release build with the fault-injection feature.
        type: boolean
        default: false

jobs:
  suite:
    name: Conformance (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        python: ["3.14"]
        include:
          - os: ubuntu-24.04
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y bubblewrap fuse3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache .venv
        uses: actions/cache@v6
        with:
          path: |
            sdk/python/.venv
            ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: venv-${{ matrix.os }}-py${{ matrix.python }}-${{ hashFiles('.python-version') }}-${{ hashFiles('sdk/python/uv.lock') }}

      - uses: ./.github/actions/setup-nx

      - name: escrowd bwrap and AppArmor profile
        run: packaging/ubuntu/install.sh

      - name: Conformance suite, ${{ inputs.runs }} consecutive run(s)
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          for i in $(seq 1 "$RUNS"); do
            echo "::group::run $i of $RUNS"
            pnpm exec nx run-many -t conformance --outputStyle=stream
            echo "::endgroup::"
          done

      - name: Crash soak, 50 random kills mid-commit
        if: inputs.soak
        run: uv run --project sdk/python --frozen python tests/soak/crash.py 50

      - name: Held soak, 50 random kills mid-review
        if: inputs.soak
        run: uv run --project sdk/python --frozen python tests/soak/held.py 50

      # Release builds compile fault injection out unless the `fault-injection` feature
      # is on; this checks the optimized commit and recovery paths under the same faults.
      - name: Release build with fault injection
        if: inputs.soak
        run: cargo build --locked --release -p escrow-cli --features fault-injection

      - name: Conformance suite, release build
        if: inputs.soak
        env:
          ESCROW_BIN: ${{ github.workspace }}/target/release/escrow
        run: pnpm exec nx run-many -t conformance --outputStyle=stream

      - name: Crash soak, release build, 20 random kills mid-commit
        if: inputs.soak
        env:
          ESCROW_BIN: ${{ github.workspace }}/target/release/escrow
        run: uv run --project sdk/python --frozen python tests/soak/crash.py 20

      - name: Held soak, release build, 20 random kills mid-review
        if: inputs.soak
        env:
          ESCROW_BIN: ${{ github.workspace }}/target/release/escrow
        run: uv run --project sdk/python --frozen python tests/soak/held.py 20

      # A failed run keeps its directory (state, ledger, history, daemon.log) under
      # XDG_RUNTIME_DIR; keep them past the runner for a week. Sockets and the
      # unmounted views are skipped.
      - name: Archive the kept run directories
        if: failure()
        run: |
          shopt -s nullglob
          kept=("${XDG_RUNTIME_DIR:-/tmp}"/escrow-test.*)
          if [ ${#kept[@]} -eq 0 ]; then exit 0; fi
          tar --ignore-failed-read --exclude='*/mount' -czf "$RUNNER_TEMP/kept-runs.tgz" "${kept[@]}" || true

      - name: Upload the kept run directories
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kept-runs-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/kept-runs.tgz
          if-no-files-found: ignore
          retention-days: 7
