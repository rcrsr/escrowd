name: Conformance

# Reusable: the conformance suite on every Ubuntu LTS runner (24.04: restriction without
# a bwrap profile; 26.04: also confines fusermount3). It needs the daemon binary, the
# Python SDK and the AppArmor profile; the SDK's oldest Python (3.11) runs on 24.04 beside
# the pinned one (.python-version). `ci.yml` runs the suite once per pull request;
# `ci-repeat.yml` runs it `runs` times in a row (check 8: 10 consecutive passes).

on:
  workflow_call:
    inputs:
      runs:
        description: Consecutive suite runs per runner; the job fails on the first failed run.
        type: number
        default: 1
      soak:
        description: Run the crash soak (50 random kills mid-commit) after the suite.
        type: boolean
        default: false

jobs:
  suite:
    name: Conformance (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        python: ["3.14"]
        include:
          - os: ubuntu-24.04
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y bubblewrap fuse3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache .venv
        uses: actions/cache@v6
        with:
          path: |
            sdk/python/.venv
            ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: venv-${{ matrix.os }}-py${{ matrix.python }}-${{ hashFiles('.python-version') }}-${{ hashFiles('sdk/python/uv.lock') }}

      - name: escrowd bwrap and AppArmor profile
        run: packaging/ubuntu/install.sh

      - name: Build
        run: cargo build --locked

      - name: Conformance suite, ${{ inputs.runs }} consecutive run(s)
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          for i in $(seq 1 "$RUNS"); do
            echo "::group::run $i of $RUNS"
            uv run --project sdk/python --frozen pytest -v tests/conformance
            echo "::endgroup::"
          done

      - name: Crash soak, 50 random kills mid-commit
        if: inputs.soak
        run: uv run --project sdk/python --frozen python tests/soak/crash.py 50
