// escrowd protocol: SDKs mark scopes, the daemon captures, gates and decides.
// Served as gRPC over a Unix socket (path in ESCROW_SOCKET). The schema evolves
// through phase 1 and freezes in phase 3; Ping reports PROTOCOL_VERSION.
//
// Spawning a scope's child needs file descriptors, which gRPC cannot carry, so
// it has its own socket beside the gRPC one: `<ESCROW_SOCKET>.exec`. Each
// connection starts one child. Frames are a little-endian u32 length followed
// by one message. The client sends the length of a SpawnRequest with its
// stdin, stdout and stderr attached (SCM_RIGHTS), then the request, then any
// number of SpawnSignal. The daemon answers with SpawnEvent frames: `pid`,
// then `exit_code`, or `error` alone. Closing the connection kills the child.
syntax = "proto3";

package escrow.v1;

service Escrow {
  // Liveness and version handshake.
  rpc Ping(PingRequest) returns (PingResponse);

  // Open a scope: snapshot at open, a virtual root under /escrow/<scope_id>/. In a
  // session that has a scope held with a wait (Outcome.wait), the call waits for that
  // scope's verdict; at the client's deadline it fails with FAILED_PRECONDITION naming
  // the held scope, which stays held.
  rpc OpenScope(OpenScopeRequest) returns (OpenScopeResponse);

  // Close a scope: the caller has fsynced its open files; the daemon stops the
  // scope's sandboxes, freezes the scope and returns its change set. Close, Decide
  // and the exec socket need the scope's token (from OpenScope); a missing or wrong
  // token fails with PERMISSION_DENIED. The unscoped scope has no token.
  rpc CloseScope(CloseScopeRequest) returns (ChangeSet);

  // Apply the close-time decision: commit, discard or return to agent. The verdict is
  // the opener's proposal and only tightens the review's (ChangeSet.review): a commit
  // or a return of a change set the software tier discarded is a discard, and a commit
  // of one that needs a tier above software holds the scope for those reviewers
  // (OUTCOME_STATUS_HELD). A held scope is the reviewers' to decide: its opener can
  // only discard (withdraw) it; a commit or a return fails with PERMISSION_DENIED.
  rpc Decide(DecideRequest) returns (Outcome);

  // Close the implicit default scope (unscoped = implicit) and return its change
  // set; decide it like any scope (scope id "unscoped"). After a commit or a
  // discard the daemon opens a fresh default scope at the same path.
  rpc SettleUnscoped(SettleUnscopedRequest) returns (ChangeSet);

  // The change set of a closed, undecided scope, diff included, without closing
  // anything: an open scope fails with FAILED_PRECONDITION. For `escrow diff`.
  rpc GetChangeSet(GetChangeSetRequest) returns (ChangeSet);
}

message PingRequest {}

message PingResponse {
  string daemon_version = 1;
  uint32 protocol_version = 2;
}

message OpenScopeRequest {
  string name = 1;
  map<string, string> labels = 2;
  // Orders an agent's scopes: the scope does not open while another scope of the
  // session is held with a wait. Empty: no session, never waits.
  string session = 3;
}

message OpenScopeResponse {
  string scope_id = 1;
  // Absolute path of the scope's virtual root inside the app's sandbox.
  string root = 2;
  // The scope's views of the served roots outside the project (policy `roots:`).
  repeated ScopeRoot roots = 3;
  // The scope's capability: CloseScope, Decide and SpawnRequest must carry it. Only
  // the opener gets it; knowing the scope id (from a path) is not enough.
  string token = 4;
}

// A root outside the project ($HOME, /tmp) served through the scope's views.
message ScopeRoot {
  // The root's host path, e.g. /home/user.
  string path = 1;
  // The scope's view of it, as `root` above (on the host: <mount>/<scope_id>.home).
  string view = 2;
  // Host paths inside the root bound directly (passthrough and read paths): not rewritten.
  repeated string direct = 3;
}

message CloseScopeRequest {
  string scope_id = 1;
  string token = 2;
}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_CREATE = 1;
  CHANGE_KIND_MODIFY = 2;
  CHANGE_KIND_DELETE = 3;
  CHANGE_KIND_RENAME = 4;
}

message Change {
  ChangeKind kind = 1;
  // Project-relative path, `~/…` in $HOME, absolute in other roots; for a rename,
  // the destination.
  string path = 2;
  // Rename source, in the same form.
  string from_path = 3;
}

enum ReadDecision {
  READ_DECISION_UNSPECIFIED = 0;
  READ_DECISION_ALLOW = 1;
  READ_DECISION_DENY = 2;
}

message Read {
  string path = 1;
  ReadDecision decision = 2;
}

message ChangeSet {
  string scope_id = 1;
  repeated Change changes = 2;
  repeated Read reads = 3;
  map<string, string> labels = 4;
  // The content diff against the scope's snapshot, in git's extended unified
  // format (`diff --git a/<path> b/<path>`, paths as in `changes`). Binary files
  // and files over the policy's diff.file_bytes are summarized by size and
  // SHA-256; the diff stops before passing diff.max_bytes, and a last line
  // starting `# escrow:` counts the files left out.
  string diff = 5;
  // Changes to captured paths the unscoped mode was asked for (allowed in implicit
  // mode, refused in deny mode) while this scope was open: IO that escaped the scope,
  // or ran beside it. Counted since the daemon started; 0 in passthrough mode, which
  // serves no unscoped scope.
  uint64 unscoped_ops = 6;
  // The close-time review: the software tier's verdict and the tiers above it the
  // change set needs (policy `write:` and `review:`).
  Review review = 7;
}

// The decision tiers, cheapest first.
enum Tier {
  TIER_UNSPECIFIED = 0;
  // The policy's rules, run by the daemon.
  TIER_SOFTWARE = 1;
  TIER_LLM = 2;
  TIER_HUMAN = 3;
}

message Review {
  // The software tier's verdict: VERDICT_DISCARD when the change set breaks a write
  // rule (then Decide turns a commit or a return into a discard: verdicts only
  // tighten), else VERDICT_COMMIT.
  Verdict verdict = 1;
  // One per broken rule: `write.deny: <path>` or `write.deny_content: <path> contains "<s>"`.
  repeated string reasons = 2;
  // The tiers above software the change set needs, cheapest first: each tier from
  // TIER_LLM up to the highest its paths need (policy `review:`, first match per path).
  // Decide holds a committed change set that needs any (OUTCOME_STATUS_HELD).
  repeated Tier tiers = 3;
  // A `review:` rule of a path that needs a tier above software requires the agent to wait.
  bool wait_required = 4;
}

message GetChangeSetRequest {
  string scope_id = 1;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_COMMIT = 1;
  VERDICT_DISCARD = 2;
  // Reasons go back to the agent; the scope reopens and continues.
  VERDICT_RETURN = 3;
}

message DecideRequest {
  string scope_id = 1;
  Verdict verdict = 2;
  repeated string reasons = 3;
  string token = 4;
  // The client waits for a held verdict: like a `review:` rule's `wait: required`,
  // the session's next scope does not open until it.
  bool wait = 5;
}

enum OutcomeStatus {
  OUTCOME_STATUS_UNSPECIFIED = 0;
  OUTCOME_STATUS_COMMITTED = 1;
  OUTCOME_STATUS_DISCARDED = 2;
  OUTCOME_STATUS_RETURNED = 3;
  // Commit refused: a path the scope wrote (or, with the policy's conflict.reads,
  // read) changed on disk since the scope's snapshot. The policy's conflict.verdict
  // drops the scope (discard, the default) or reopens it (return; see `reopened`).
  OUTCOME_STATUS_CONFLICT = 4;
  // Not decided yet: held for the reviewers in `tiers`. Nothing reached the project.
  OUTCOME_STATUS_HELD = 5;
}

message Outcome {
  string scope_id = 1;
  OutcomeStatus status = 2;
  repeated string paths = 3;
  repeated string reasons = 4;
  // The scope is open again with its changes: verdict return, or a conflict under
  // conflict.verdict return.
  bool reopened = 5;
  // OUTCOME_STATUS_HELD: the tiers still to review, cheapest first.
  repeated Tier tiers = 6;
  // OUTCOME_STATUS_HELD: the session's next scope waits for the verdict (a review rule
  // requires it, or the client asked to wait).
  bool wait = 7;
}

// Exec socket: start argv in the scope's sandbox, with the scope's view over the project.
message SpawnRequest {
  string scope_id = 1;
  repeated string argv = 2;
  // The caller's working directory; a path in the project or in the scope's view
  // (/escrow/<scope_id>/ in the app's sandbox, <mount>/<scope_id>/ on the host) maps
  // to the same place in the sandbox, anything else to the project root.
  string cwd = 3;
  map<string, string> env = 4;
  // The scope's token (OpenScopeResponse.token); `escrow exec` reads it from
  // ESCROW_SCOPE_TOKEN, which the child does not get.
  string token = 5;
}

message SpawnEvent {
  oneof event {
    // The child started; PID of the sandbox, in the daemon's PID namespace.
    int32 pid = 1;
    // The child exited: its status, or 128 + the signal that killed it.
    int32 exit_code = 2;
    // The child could not start (unknown or closed scope, wrong token, bad request).
    string error = 3;
  }
}

// Exec socket: deliver a signal to the command (not to bwrap).
message SpawnSignal {
  int32 signal = 1;
}

message SettleUnscopedRequest {}
