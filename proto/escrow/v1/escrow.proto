// escrowd protocol: SDKs mark scopes, the daemon captures, gates and decides.
// Served as gRPC over a Unix socket (path in ESCROW_SOCKET). The schema evolves
// through phase 1 and freezes in phase 3; Ping reports PROTOCOL_VERSION.
//
// Spawning a scope's child needs file descriptors, which gRPC cannot carry, so
// it has its own socket beside the gRPC one: `<ESCROW_SOCKET>.exec`. Each
// connection starts one child. Frames are a little-endian u32 length followed
// by one message. The client sends the length of a SpawnRequest with its
// stdin, stdout and stderr attached (SCM_RIGHTS), then the request, then any
// number of SpawnSignal. The daemon answers with SpawnEvent frames: `pid`,
// then `exit_code`, or `error` alone. Closing the connection kills the child.
syntax = "proto3";

package escrow.v1;

service Escrow {
  // Liveness and version handshake.
  rpc Ping(PingRequest) returns (PingResponse);

  // Open a scope: snapshot at open, a virtual root under /escrow/<scope_id>/.
  rpc OpenScope(OpenScopeRequest) returns (OpenScopeResponse);

  // Close a scope: the caller has fsynced its open files; the daemon stops the
  // scope's sandboxes, freezes the scope and returns its change set.
  rpc CloseScope(CloseScopeRequest) returns (ChangeSet);

  // Apply the close-time decision: commit, discard or return to agent.
  rpc Decide(DecideRequest) returns (Outcome);

  // Close the implicit default scope (unscoped = implicit) and return its change
  // set; decide it like any scope (scope id "unscoped"). After a commit or a
  // discard the daemon opens a fresh default scope at the same path.
  rpc SettleUnscoped(SettleUnscopedRequest) returns (ChangeSet);
}

message PingRequest {}

message PingResponse {
  string daemon_version = 1;
  uint32 protocol_version = 2;
}

message OpenScopeRequest {
  string name = 1;
  map<string, string> labels = 2;
}

message OpenScopeResponse {
  string scope_id = 1;
  // Absolute path of the scope's virtual root inside the app's sandbox.
  string root = 2;
}

message CloseScopeRequest {
  string scope_id = 1;
}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_CREATE = 1;
  CHANGE_KIND_MODIFY = 2;
  CHANGE_KIND_DELETE = 3;
  CHANGE_KIND_RENAME = 4;
}

message Change {
  ChangeKind kind = 1;
  // Project-relative path; for a rename, the destination.
  string path = 2;
  // Rename source, project-relative.
  string from_path = 3;
}

enum ReadDecision {
  READ_DECISION_UNSPECIFIED = 0;
  READ_DECISION_ALLOW = 1;
  READ_DECISION_DENY = 2;
}

message Read {
  string path = 1;
  ReadDecision decision = 2;
}

message ChangeSet {
  string scope_id = 1;
  repeated Change changes = 2;
  repeated Read reads = 3;
  map<string, string> labels = 4;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_COMMIT = 1;
  VERDICT_DISCARD = 2;
  // Reasons go back to the agent; the scope reopens and continues.
  VERDICT_RETURN = 3;
}

message DecideRequest {
  string scope_id = 1;
  Verdict verdict = 2;
  repeated string reasons = 3;
}

enum OutcomeStatus {
  OUTCOME_STATUS_UNSPECIFIED = 0;
  OUTCOME_STATUS_COMMITTED = 1;
  OUTCOME_STATUS_DISCARDED = 2;
  OUTCOME_STATUS_RETURNED = 3;
  // Commit refused: a written path changed on disk since the scope's snapshot.
  OUTCOME_STATUS_CONFLICT = 4;
}

message Outcome {
  string scope_id = 1;
  OutcomeStatus status = 2;
  repeated string paths = 3;
  repeated string reasons = 4;
}

// Exec socket: start argv in the scope's sandbox, with the scope's view over the project.
message SpawnRequest {
  string scope_id = 1;
  repeated string argv = 2;
  // The caller's working directory; a path in the project or in the scope's view
  // (/escrow/<scope_id>/ in the app's sandbox, <mount>/<scope_id>/ on the host) maps
  // to the same place in the sandbox, anything else to the project root.
  string cwd = 3;
  map<string, string> env = 4;
}

message SpawnEvent {
  oneof event {
    // The child started; PID of the sandbox, in the daemon's PID namespace.
    int32 pid = 1;
    // The child exited: its status, or 128 + the signal that killed it.
    int32 exit_code = 2;
    // The child could not start (unknown or closed scope, bad request).
    string error = 3;
  }
}

// Exec socket: deliver a signal to the command (not to bwrap).
message SpawnSignal {
  int32 signal = 1;
}

message SettleUnscopedRequest {}
