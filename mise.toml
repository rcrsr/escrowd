# Every binary the repo uses, pinned exactly; mise.lock holds checksums and provenance for
# linux-x64, linux-arm64 and macos-arm64 (APP-TC-1, APP-TC-6). Refresh it with `make toolchain-lock`.
# Python is uv-managed (UV_PYTHON below), not a mise tool: no .python-version (APP-TC-4).
min_version = "2026.10.0"

[tools]
rust = { version = "1.100.0", profile = "minimal", components = "clippy,rustfmt,llvm-tools-preview" } # equals rust-toolchain.toml (APP-TC-5)
cargo-binstall = "1.28.0"
"cargo:cargo-nextest" = "0.9.152"
"cargo:cargo-llvm-cov" = "0.9.2"
"cargo:cargo-deny" = "0.22.0"
"cargo:cargo-machete" = "0.10.1"
node = "26.13.1"
pnpm = "12.23.0"
uv = "0.13.9"
lefthook = "2.2.2"
jq = "1.8.2"
gh = "2.105.0"
actionlint = "1.7.12"
zizmor = "1.33.1"
gitleaks = "8.30.1"
osv-scanner = "2.7.1"
typos = "1.52.2"
buf = "1.75.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
"github:rcrsr/rcrsr-codanna" = "0.17.1+rcrsr.13"
lima = "2.3.0"
ripgrep = "15.2.0" # bench workload C; held for comparable results

[env]
_.file = ".env.local"
# The dev and CI interpreter. The conformance matrix sets ESCROWD_PYTHON per leg.
UV_PYTHON = "{{ get_env(name='ESCROWD_PYTHON', default='3.15.2') }}"
NX_USE_LOCAL = "true" # APP-TMP-8: the Nx daemon never installs nx@latest into /tmp

[settings]
lockfile = true
locked_verify_provenance = true
activate_aggressive = true

[[watch_files]]
patterns = ["mise.toml", "mise.lock"]
run = "mise install --locked --yes --quiet"
